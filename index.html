<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Innovaritas is a small creative digital studio building apps, browser extensions, and more." />
  <title>Innovaritas</title>
  <link rel="icon" type="image/png" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>

  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/"><img src="/assets/logo.png" alt="Innovaritas" /></a>
      <nav class="site-nav">
        <a href="/" class="active" aria-current="page">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="wrap">

      <section class="hero-grid">
        <div class="hero-copy">
          <h1 class="hero-heading">A <span class="hero-underline">small, creative</span><br />digital studio.</h1>
          <p class="lede">We build useful apps, browser extensions, and, eventually, a lot more. Right now, that's Pin Shuffler for Chrome.</p>
          <div class="hero-cta-row">
            <a class="btn" href="/contact.html">Start a project</a>
            <a class="btn btn-secondary" href="/projects.html">See our work</a>
          </div>
        </div>
        <div class="hero-stack" role="group" aria-label="Innovaritas projects">
          <button type="button" class="stack-card stack-ghost" data-project="genuine-article" data-pos="left">
            <span class="ghost-name">GenuineArticle &middot; In progress</span>
            <span class="ghost-tagline">Real goods, not AI slop</span>
            <span class="sr-only stack-hint">View project</span>
          </button>
          <button type="button" class="stack-card stack-live" data-project="pin-shuffler" data-pos="center" data-href="https://chromewebstore.google.com/detail/pin-shuffler/cihfjcnmcliibgcleihgeoeennnggopk">
            <img src="/assets/pin-shuffler-pin.jpg" alt="" width="640" height="960" loading="lazy" />
            <span class="stack-caption"><span class="dot"></span>Pin Shuffler &middot; Live</span>
            <span class="sr-only stack-hint">Open project</span>
          </button>
          <button type="button" class="stack-card stack-ghost" data-project="the-unsubscriber" data-pos="right">
            <span class="ghost-name">The Unsubscriber &middot; In progress</span>
            <span class="ghost-tagline">Junk mail, handled</span>
            <span class="sr-only stack-hint">View project</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© 2026 Innovaritas, LLC · <a href="/privacy/pin-shuffler.html">Privacy</a> · <a href="/contact.html">Contact</a></p>
    </div>
  </footer>

  <script src="/assets/hero-stack.js" defer></script>
</body>
</html>
